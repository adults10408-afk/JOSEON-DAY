<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>조선의 하루 - MVP</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#17221d;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#fff;overflow:hidden}
#app{height:100vh;display:flex;justify-content:center;align-items:center}
#game{position:relative;width:min(100vw,520px);height:100vh;max-height:920px;overflow:hidden;background:#b9c98d}
canvas{width:100%;height:100%;display:block;touch-action:none}
.panel{position:absolute;inset:0;background:rgba(20,25,20,.88);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center;z-index:5}
.panel h1{font-size:34px;margin:0 0 8px}
.panel p{line-height:1.55;color:#d8ddd5;margin:8px 0 22px}
.cards{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:430px}
.card,.btn{border:1px solid #71806a;background:#29372d;color:#fff;border-radius:14px;padding:15px;cursor:pointer}
.card b{display:block;font-size:19px;margin-bottom:5px}.card small{color:#bac4b7;line-height:1.45}
.card:active,.btn:active{transform:scale(.98);background:#3a4b3d}
.card.selected{outline:3px solid #e4c76b;background:#394a3c}
.btn{margin-top:15px;background:#765c35;border:0;font-size:18px;font-weight:700;padding:14px 30px}
#hud{position:absolute;top:0;left:0;right:0;padding:10px;z-index:2;pointer-events:none}
.stats{display:flex;gap:5px;flex-wrap:wrap}
.stat{background:rgba(22,30,23,.83);border-radius:10px;padding:7px 9px;font-size:13px}
#hint{margin-top:7px;background:rgba(22,30,23,.72);display:inline-block;padding:6px 9px;border-radius:9px;font-size:12px}
#controls{position:absolute;bottom:16px;left:16px;z-index:3;display:grid;grid-template-columns:52px 52px 52px;grid-template-rows:52px 52px;gap:5px}
.ctrl{border:0;border-radius:13px;background:rgba(28,38,30,.78);color:#fff;font-size:23px}
.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}
#actions{position:absolute;right:14px;bottom:18px;z-index:3;display:flex;flex-direction:column;gap:7px}
.action{border:0;border-radius:13px;background:rgba(93,68,37,.9);color:#fff;padding:11px 12px;font-weight:700}
#toast{position:absolute;top:115px;left:50%;transform:translateX(-50%);z-index:4;background:rgba(25,29,24,.92);padding:10px 15px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
#eventText{max-width:420px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"><div id="game">
<canvas id="canvas"></canvas>
<div id="hud" class="hidden">
  <div class="stats">
    <div class="stat">🪙 <span id="money">0</span></div>
    <div class="stat">🌾 <span id="food">0</span></div>
    <div class="stat">🪵 <span id="wood">0</span></div>
    <div class="stat">🪨 <span id="stone">0</span></div>
    <div class="stat">👥 <span id="people">0</span></div>
  </div>
  <div id="hint">자원을 모아 집을 지어보세요.</div>
</div>
<div id="controls" class="hidden">
  <button class="ctrl up" data-key="up">▲</button>
  <button class="ctrl left" data-key="left">◀</button>
  <button class="ctrl down" data-key="down">▼</button>
  <button class="ctrl right" data-key="right">▶</button>
</div>
<div id="actions" class="hidden">
  <button class="action" id="buildHouse">🏠 집 건설</button>
  <button class="action" id="buildWell">🪣 우물 건설</button>
  <button class="action" id="special">✨ 특수능력</button>
</div>
<div id="toast"></div>

<div id="start" class="panel">
  <h1>조선의 하루</h1>
  <p>신분에 따라 다른 방법으로 마을을 성장시키세요.<br>그리고 당신의 발전이 다른 사람에게도 영향을 줍니다.</p>
  <div class="cards">
    <button class="card" data-class="royal"><b>👑 왕족</b><small>권력과 자본<br>명령으로 자원 획득</small></button>
    <button class="card" data-class="yangban"><b>🎩 양반</b><small>토지와 인맥<br>건설·생산 보너스</small></button>
    <button class="card" data-class="common"><b>🧑 상민</b><small>노동과 장사<br>자원·거래 효율</small></button>
    <button class="card" data-class="cheonmin"><b>🪓 천민</b><small>강한 노동력<br>공동체 발전의 큰 수혜</small></button>
  </div>
  <button id="startBtn" class="btn" disabled>신분을 선택하세요</button>
</div>

<div id="event" class="panel hidden">
  <h1 id="eventTitle">마을에 문제가 생겼습니다.</h1>
  <p id="eventText"></p>
  <div id="eventButtons" class="cards"></div>
</div>

<div id="end" class="panel hidden">
  <h1>마을의 하루가 끝났습니다</h1>
  <p id="endText"></p>
  <button class="btn" onclick="location.reload()">다시 시작</button>
</div>
</div></div>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let W,H,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize); resize();

const classes={
 royal:{name:'왕족',money:100,food:50,wood:20,stone:10,people:5,color:'#d7b85b',speed:2.8,collect:3},
 yangban:{name:'양반',money:70,food:40,wood:30,stone:15,people:6,color:'#6d78a8',speed:3.0,collect:4},
 common:{name:'상민',money:30,food:30,wood:40,stone:15,people:8,color:'#a76f45',speed:3.4,collect:6},
 cheonmin:{name:'천민',money:10,food:20,wood:50,stone:10,people:10,color:'#7b8067',speed:3.7,collect:8}
};
let selected=null, game=false, keys={}, time=0, last=0, eventTimer=18, buildings=[];
let s={money:0,food:0,wood:0,stone:0,people:0,happiness:50,houses:0,wells:0};
let p={x:0,y:0};
let resources=[];
const names=['royal','yangban','common','cheonmin'];
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1300)}
function stat(){for(const k of ['money','food','wood','stone','people'])document.getElementById(k).textContent=Math.floor(s[k])}
function choose(c){
 selected=c; document.querySelectorAll('.card').forEach(x=>x.classList.remove('selected'));
 document.querySelector(`[data-class="${c}"]`).classList.add('selected');
 document.getElementById('startBtn').disabled=false;document.getElementById('startBtn').textContent=`${classes[c].name}으로 시작`;
}
document.querySelectorAll('.card').forEach(x=>x.onclick=()=>choose(x.dataset.class));
document.getElementById('startBtn').onclick=startGame;

function startGame(){
 const c=classes[selected]; Object.assign(s,{money:c.money,food:c.food,wood:c.wood,stone:c.stone,people:c.people});
 p={x:W/2,y:H/2+40}; game=true; document.getElementById('start').classList.add('hidden');
 ['hud','controls','actions'].forEach(id=>document.getElementById(id).classList.remove('hidden'));
 spawnResources(); stat(); toast(`${c.name}으로 마을을 시작합니다.`);
 requestAnimationFrame(loop);
}
function spawnResources(){
 resources=[];
 const types=[['wood','🌲'],['wood','🌲'],['food','🌾'],['food','🌾'],['stone','🪨'],['money','🪙'],['wood','🌲'],['food','🌾']];
 for(const [type,emoji] of types)resources.push({type,emoji,x:40+Math.random()*(W-80),y:150+Math.random()*(H-260),alive:true});
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function update(dt){
 const c=classes[selected], sp=c.speed*(dt/16.67);
 let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);
 if(dx||dy){let l=Math.hypot(dx,dy);p.x+=dx/l*sp;p.y+=dy/l*sp}
 p.x=clamp(p.x,25,W-25);p.y=clamp(p.y,125,H-55);
 for(const r of resources)if(r.alive&&Math.hypot(p.x-r.x,p.y-r.y)<32){
   r.alive=false; s[r.type]+=c.collect;
   if(r.type==='wood')toast(`🪵 나무 +${c.collect}`);
   if(r.type==='food')toast(`🌾 식량 +${c.collect}`);
   if(r.type==='stone')toast(`🪨 돌 +${c.collect}`);
   if(r.type==='money')toast(`🪙 돈 +${c.collect}`);
   stat();
 }
 if(resources.every(r=>!r.alive))spawnResources();
 time+=dt/1000; eventTimer-=dt/1000;
 if(eventTimer<=0){eventTimer=28;showEvent()}
 if(time>=180){endGame()}
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#b9c98d';ctx.fillRect(0,0,W,H);
 // fields/roads
 ctx.fillStyle='#a8b77d';for(let i=0;i<7;i++)ctx.fillRect(0,150+i*95,W,2);
 ctx.strokeStyle='#c4ae78';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(0,H*.55);ctx.lineTo(W,H*.55);ctx.stroke();
 // buildings
 for(const b of buildings){
   ctx.fillStyle=b.type==='well'?'#64747b':'#7b5c43';ctx.fillRect(b.x-22,b.y-18,44,36);
   ctx.fillStyle=b.type==='well'?'#d4d9d4':'#654638';ctx.fillRect(b.x-25,b.y-27,50,12);
   ctx.font='22px sans-serif';ctx.textAlign='center';ctx.fillText(b.type==='well'?'🪣':'🏠',b.x,b.y+8);
 }
 // resources
 ctx.textAlign='center';ctx.font='26px sans-serif';for(const r of resources)if(r.alive)ctx.fillText(r.emoji,r.x,r.y);
 // player
 ctx.beginPath();ctx.fillStyle=classes[selected].color;ctx.arc(p.x,p.y,17,0,Math.PI*2);ctx.fill();
 ctx.font='24px sans-serif';ctx.fillText(selected==='royal'?'👑':selected==='yangban'?'🎩':selected==='common'?'🧑':'🪓',p.x,p.y-22);
}
function loop(t){if(!game)return;const dt=Math.min(t-last,50);last=t;update(dt);draw();requestAnimationFrame(loop)}
function hold(btn,key){
 const on=e=>{e.preventDefault();keys[key]=true},off=e=>{e.preventDefault();keys[key]=false};
 btn.addEventListener('touchstart',on,{passive:false});btn.addEventListener('touchend',off,{passive:false});btn.addEventListener('touchcancel',off,{passive:false});
 btn.addEventListener('mousedown',on);btn.addEventListener('mouseup',off);btn.addEventListener('mouseleave',off);
}
document.querySelectorAll('.ctrl').forEach(b=>hold(b,b.dataset.key));
addEventListener('keydown',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=true;if(['ArrowDown','s','S'].includes(e.key))keys.down=true;if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true});
addEventListener('keyup',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=false;if(['ArrowDown','s','S'].includes(e.key))keys.down=false;if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});

document.getElementById('buildHouse').onclick=()=>{
 if(s.wood<25||s.stone<5)return toast('나무 25 + 돌 5가 필요합니다.');
 s.wood-=25;s.stone-=5;s.houses++;s.people+=2;s.happiness+=3;
 buildings.push({type:'house',x:70+Math.random()*(W-140),y:160+Math.random()*(H-300)});
 // 반사이익
 if(selected==='royal')s.money+=8; if(selected==='yangban')s.food+=5; if(selected==='common')s.money+=5; if(selected==='cheonmin')s.food+=8;
 toast('🏠 집 완성! 주민 +2, 모두에게 작은 이익');stat();
};
document.getElementById('buildWell').onclick=()=>{
 if(s.wood<20||s.stone<15)return toast('나무 20 + 돌 15가 필요합니다.');
 s.wood-=20;s.stone-=15;s.wells++;s.happiness+=8;
 // 반사이익: 모든 신분에 다른 형태의 이익
 s.food+=10;
 if(selected==='cheonmin')s.wood+=10;
 if(selected==='common')s.money+=8;
 if(selected==='yangban')s.money+=5;
 if(selected==='royal')s.money+=10;
 buildings.push({type:'well',x:70+Math.random()*(W-140),y:160+Math.random()*(H-300)});
 toast('🪣 우물 완성! 마을 전체가 혜택을 받습니다.');stat();
};
document.getElementById('special').onclick=()=>{
 if(selected==='royal'){s.money+=25;toast('👑 왕명! 세금/공납으로 돈 +25')}
 else if(selected==='yangban'){s.food+=15;s.money+=10;toast('🎩 인맥! 농장과 거래에서 이익')}
 else if(selected==='common'){s.money+=20;s.food+=5;toast('🧑 장사! 시장에서 돈 +20')}
 else {s.wood+=25;s.food+=10;toast('🪓 노동력! 자원 +35')}
 stat();
};

function showEvent(){
 const panel=document.getElementById('event'),btns=document.getElementById('eventButtons');
 document.getElementById('eventTitle').textContent='가뭄이 찾아왔습니다';
 document.getElementById('eventText').textContent='마을의 식량이 줄어들고 있습니다. 누구의 부담으로 해결할까요?';
 btns.innerHTML='';
 const opts=[
  ['왕실 창고를 연다',()=>{s.money-=15;s.food+=35;s.happiness+=5;toast('왕실 창고가 열렸습니다.') }],
  ['백성에게 곡식을 거둔다',()=>{s.money+=20;s.food-=5;s.happiness-=12;toast('세금은 늘었지만 민심이 흔들립니다.')}],
  ['양반에게 부담을 요청한다',()=>{s.money-=5;s.food+=25;s.happiness+=2;toast('양반이 곡식을 내놓았습니다.')}]
 ];
 opts.forEach(([t,fn])=>{const b=document.createElement('button');b.className='card';b.textContent=t;b.onclick=()=>{fn();panel.classList.add('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('controls').classList.remove('hidden');document.getElementById('actions').classList.remove('hidden');stat()};btns.appendChild(b)});
 panel.classList.remove('hidden');['hud','controls','actions'].forEach(id=>document.getElementById(id).classList.add('hidden'));
}
function endGame(){
 game=false;document.getElementById('hud').classList.add('hidden');document.getElementById('controls').classList.add('hidden');document.getElementById('actions').classList.add('hidden');
 document.getElementById('endText').innerHTML=`${classes[selected].name}으로서<br><b>주민 ${Math.floor(s.people)}명 · 집 ${s.houses}채 · 우물 ${s.wells}개</b><br>행복도 ${Math.floor(s.happiness)}<br><br>당신이 만든 마을은 어떤 조선이었을까요?`;
 document.getElementById('end').classList.remove('hidden');
}
</script>
</body>
</html>
